<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中文練字紙 v3.0</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{ --accent:#F97316; --ink:#111827; --card:#ffffff; --line:#FFE4B5; }
    *{ box-sizing:border-box }
    body{ font-family:'Noto Sans TC',sans-serif; margin:0; background:#fff; color:var(--ink); }
    .container{ max-width:1200px; margin:0 auto; padding:20px; }
    .banner{ display:block; width:100%; max-width:1200px; margin:0 auto 20px; border-radius:12px; }
    .card{ background:var(--card); border-radius:12px; padding:20px; box-shadow:0 4px 12px rgba(0,0,0,.08); margin-bottom:20px; }
    label{ display:block; margin-bottom:6px; font-weight:700; }
    textarea{ width:100%; min-height:180px; padding:12px; font-size:18px; line-height:1.7; border:1px solid #e5e7eb; border-radius:10px; font-family:'Noto Sans TC',sans-serif; }
    input,select{ padding:10px; border:1px solid #e5e7eb; border-radius:10px; font-size:16px; }
    .row{ display:flex; gap:16px; flex-wrap:wrap; }
    .col{ flex:1 1 220px; min-width:180px; }
    #preview{ border:2px dashed #e5e7eb; padding:16px; min-height:400px; overflow:auto; background:#fafafa; display:flex; flex-direction:column; align-items:center; }
    canvas{ max-width:100%; display:block; margin:8px auto; border-radius:8px; background:#fff; }
    .btn{ padding:10px 16px; border-radius:10px; border:none; cursor:pointer; font-size:16px; }
    .btn-primary{ background:var(--accent); color:#fff; }
    .btn-ghost{ background:#fff; border:1px solid #e5e7eb; color:var(--ink); }
    .toolbar{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    footer{ font-size:.9rem; color:#6b7280; text-align:center; margin-top:20px; }
  </style>
</head>
<body>
  <div class="container">
    <picture>
      <source media="(max-width: 600px)" srcset="assets/banner_mobile.png">
      <img src="assets/banner.png" class="banner" alt="中文練字紙">
    </picture>

    <div class="card">
      <label for="titleInput">自訂標題</label>
      <input id="titleInput" type="text" value="中文練字紙" style="width:100%;margin-bottom:10px"/>
      <label for="inputText">練習文字</label>
      <div class="toolbar">
        <button id="underlineBtn" class="btn btn-ghost">底線</button>
      </div>
      <textarea id="inputText">請輸入文章內容

提示：
輸入換行會在練習紙中換行，標點符號單獨佔格</textarea>

      <div class="row" style="margin-top:12px">
        <div class="col"><label>方格大小（mm，5–100）</label><input id="gridSize" type="number" value="10" min="5" max="100"></div>
        <div class="col"><label>左右邊界（mm）</label><input id="marginSize" type="number" value="10" min="0" max="100"></div>
        <div class="col"><label>字體</label><select id="fontSelect"><option value="Noto Sans TC" selected>Noto Sans TC</option><option value="DFKai-SB">標楷體</option></select></div>
        <div class="col"><label>顏色</label><select id="fontColor"><option value="rgba(0,0,0,0.4)" selected>灰</option><option value="#000">黑</option><option value="#87CEFA">淺藍</option><option value="#FFB6C1">粉紅</option><option value="#FFD580">淺橙</option></select></div>
      </div>

      <div style="margin-top:16px; display:flex; gap:8px; flex-wrap:wrap;">
        <button id="generateBtn" class="btn btn-primary">生成練習紙</button>
        <button id="downloadPdfBtn" class="btn btn-ghost">下載 PDF</button>
        <button id="exportPngBtn" class="btn btn-ghost">匯出 PNG（可匯入 Canva）</button>
      </div>
    </div>

    <div class="card"><div id="preview">預覽區</div></div>
    <footer>© 中文練字紙 Chinese Handwriting Practice v3.0</footer>
  </div>

  <!-- Load jsPDF reliably -->
  <script>
    window.jsPDFReady = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/npm/jspdf@2.5.3/dist/jspdf.umd.min.js";
      s.onload = resolve;
      s.onerror = () => reject(new Error("jsPDF 載入失敗"));
      document.head.appendChild(s);
    });
  </script>

  <script>
    const inputText=document.getElementById('inputText');
    const gridSizeInput=document.getElementById('gridSize');
    const marginSizeInput=document.getElementById('marginSize');
    const fontSelect=document.getElementById('fontSelect');
    const fontColorSelect=document.getElementById('fontColor');
    const preview=document.getElementById('preview');
    const generateBtn=document.getElementById('generateBtn');
    const downloadPdfBtn=document.getElementById('downloadPdfBtn');
    const exportPngBtn=document.getElementById('exportPngBtn');
    const titleInput=document.getElementById('titleInput');
    const underlineBtn=document.getElementById('underlineBtn');
    let canvases=[];

    underlineBtn.onclick=()=>{
      const t=inputText;
      const s=t.selectionStart,e=t.selectionEnd;
      if(s===e){alert('請先選取文字');return;}
      t.value=t.value.slice(0,s)+'__'+t.value.slice(s,e)+'__'+t.value.slice(e);
    };

    function parseTextToRows(text,cols){
      const lines=text.split('\n');const rows=[];
      lines.forEach(line=>{
        const chars=Array.from(line);
        for(let i=0;i<chars.length;i+=cols)rows.push(chars.slice(i,i+cols));
        if(chars.length===0)rows.push([]);
      });return rows;
    }

    function drawTianzige(ctx,x,y,size){
      ctx.lineWidth=1;ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#FFE4B5';
      ctx.strokeRect(x,y,size,size);
      ctx.setLineDash([3,3]);
      const cx=x+size/2,cy=y+size/2;
      ctx.beginPath();ctx.moveTo(x+size/3,y);ctx.lineTo(x+size/3,y+size);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+2*size/3,y);ctx.lineTo(x+2*size/3,y+size);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y+size/3);ctx.lineTo(x+size,y+size/3);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x,y+2*size/3);ctx.lineTo(x+size,y+2*size/3);ctx.stroke();
      ctx.setLineDash([]);
    }

    function mmToPx(mm){ return mm*3.78; } // rough A4 CSS pixel mapping

    function createPage(text,gridMm,marginMm,font,fontColor){
      const gridPx=mmToPx(gridMm),marginPx=mmToPx(marginMm);
      const pageW=1122,pageH=793,usableW=pageW-marginPx*2;
      const cols=Math.max(1, Math.floor(usableW/gridPx));
      const rows=parseTextToRows(text,cols);
      const canvas=document.createElement('canvas');
      canvas.width=pageW;canvas.height=pageH;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,pageW,pageH);
      ctx.fillStyle=fontColor;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.font=Math.floor(gridPx*0.6)+'px "'+font+'"';
      rows.forEach((row,r)=>{
        const y=80+r*gridPx;
        for(let c=0;c<cols;c++){
          const x=marginPx+c*gridPx;
          drawTianzige(ctx,x,y,gridPx);
          if(c<row.length){ const ch=row[c]; if(ch&&ch!==' ') ctx.fillText(ch,x+gridPx/2,y+gridPx/2); }
        }
        // underline groups: merge __...__
        let c=0;
        while(c<row.length){
          if(row[c]==='_' && row[c+1]==='_'){
            // find closing __
            let j=c+2;
            while(j<row.length-1 && !(row[j]==='_' && row[j+1]==='_')) j++;
            if(j<row.length-1){
              const start=c+2, end=j-1;
              const pad=gridPx*0.1, thickness=Math.max(1, Math.round(gridPx/20));
              const ux=marginPx + start*gridPx + pad;
              const uw=(end - start + 1)*gridPx - pad*2;
              const uy=y + gridPx - Math.max(2, Math.round(gridPx*0.12));
              ctx.fillStyle=fontColor; ctx.fillRect(ux, uy, uw, thickness);
              c=j+2;
              continue;
            }
          }
          c++;
        }
      });
      ctx.fillStyle='#000';ctx.font='24px "Noto Sans TC",sans-serif';ctx.textAlign='left';
      ctx.fillText(titleInput.value,marginPx,40);
      return canvas;
    }

    function generate(){
      const text=inputText.value;
      const font=fontSelect.value;
      const fontColor=fontColorSelect.value;
      const grid=parseFloat(gridSizeInput.value)||10;
      const margin=parseFloat(marginSizeInput.value)||10;
      canvases=[createPage(text,grid,margin,font,fontColor)];
      preview.innerHTML=''; preview.appendChild(canvases[0]);
    }
    generateBtn.onclick=generate;

    async function exportPDF(){
      if(!canvases.length){alert('請先生成練習紙');return;}
      try{
        await window.jsPDFReady;
        const {jsPDF}=window.jspdf;
        const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
        const pageW=pdf.internal.pageSize.getWidth();
        const img=canvases[0].toDataURL('image/png');
        pdf.addImage(img,'PNG',10,10,pageW-20,0);
        pdf.save('中文練字紙_v3.0.pdf');
      }catch(e){ alert('PDF 生成失敗: '+e.message); }
    }
    downloadPdfBtn.onclick=exportPDF;

    function exportPNG(){
      if(!canvases.length){alert('請先生成練習紙');return;}
      const title=(titleInput.value||'中文練字紙').replace(/[\/:*?"<>|]/g,'').trim()||'sheet';
      const dateStr=new Date().toISOString().slice(0,10).replace(/-/g,'');
      canvases.forEach((c,i)=>{
        const name=`${title}_${dateStr}_p${i+1}.png`;
        c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }, 'image/png');
      });
    }
    exportPngBtn.onclick=exportPNG;

    // Auto-generate on load for preview
    window.addEventListener('load', ()=> setTimeout(generate, 300));
  </script>
</body>
</html>
